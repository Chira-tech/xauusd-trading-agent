# What success and failure mean for the agent.
# Every reflection cycle scores the last batch of trades against these numbers.

asset: "XAU/USD spot gold"   # spot gold priced in US dollars
data_source: "twelvedata"    # twelvedata (needs TWELVEDATA_API_KEY) | yahoo | yfinance
                             # override without editing this file: DATA_SOURCE=... in .env
yf_symbol: "GC=F"            # ticker used only by the yahoo / yfinance sources

target_return_30d: 0.10   # SUCCESS: +10% compounded over a batch of trades
max_drawdown: 0.05        # FAILURE: 5% peak-to-trough equity drawdown
min_sharpe: 1.2           # QUALITY BAR: annualised Sharpe of the batch must clear this
failure_below: -0.04      # SCORE FLOOR: realised return under this is scored steeply negative

reflection_every: 5       # run a reflection cycle after every N closed trades
one_variable_only: true   # scientific-method guardrail: exactly one change per cycle
starting_equity: 10000.0  # paper account size, USD
